name: CodeFormerRepair
options:
  bundleIdPrefix: com.imgrepair
  deploymentTarget:
    iOS: "16.0"
targets:
  CodeFormerRepair:
    type: application
    platform: iOS
    sources:
      - path: CodeFormerApp
      # Generated by convert/convert_coreml.py (the GitHub workflow does this automatically).
      - path: Models/CodeFormer.mlpackage
        type: file
        buildPhase: sources
    settings:
      base:
        PRODUCT_NAME: CodeFormer
        PRODUCT_BUNDLE_IDENTIFIER: com.imgrepair.codeformer
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: CodeFormer
        INFOPLIST_KEY_NSPhotoLibraryAddUsageDescription: 將修復後的照片儲存到相簿
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        COREML_CODEGEN_LANGUAGE: None
        CODE_SIGN_STYLE: Automatic
    scheme: {}
