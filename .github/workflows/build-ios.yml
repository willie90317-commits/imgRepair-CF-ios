name: Build iOS app

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Restore converted model from cache
        id: model
        uses: actions/cache@v4
        with:
          path: ios/Models/CodeFormer.mlpackage
          key: coreml-${{ hashFiles('convert/cf_loader.py', 'convert/export_model.py', 'convert/convert_coreml.py') }}

      - uses: actions/setup-python@v5
        if: steps.model.outputs.cache-hit != 'true'
        with:
          python-version: '3.11'

      - name: Convert CodeFormer to Core ML and verify against PyTorch
        if: steps.model.outputs.cache-hit != 'true'
        run: |
          pip install torch==2.5.1 coremltools==8.3.0 numpy==1.26.4 pillow
          git clone --depth 1 https://github.com/sczhou/CodeFormer.git "$RUNNER_TEMP/CodeFormer"
          cd convert
          python convert_coreml.py "$RUNNER_TEMP/CodeFormer" ../ios/Models \
            "$RUNNER_TEMP/CodeFormer/inputs/cropped_faces/0143.png"

      - name: Upload Core ML check images
        if: steps.model.outputs.cache-hit != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: coreml-check
          path: ios/Models/*.png

      - name: Generate Xcode project
        run: |
          brew install xcodegen
          cd ios && xcodegen generate

      - name: Build (unsigned)
        run: |
          cd ios
          xcodebuild -project CodeFormerRepair.xcodeproj -scheme CodeFormerRepair \
            -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' \
            -derivedDataPath build CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/CodeFormer.app Payload/
          zip -qry CodeFormer-unsigned.ipa Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: CodeFormer-ipa
          path: ios/CodeFormer-unsigned.ipa
